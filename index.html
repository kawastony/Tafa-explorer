<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TAFA Explorer — Kawastony</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #080d15;
      color: #e2e8f0;
      overflow: hidden;
      height: 100vh;
    }
    #canvas-container { position: absolute; inset: 0; }
    canvas { display: block; }

    /* Top bar */
    .topbar {
      position: absolute; top: 0; left: 0; right: 0; z-index: 20;
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 20px;
      background: linear-gradient(to bottom, rgba(8,13,21,0.92), transparent);
      pointer-events: none;
    }
    .topbar * { pointer-events: auto; }
    .logo {
      font-weight: 700; letter-spacing: 0.08em; font-size: 1.1rem;
      color: #00d4ff;
    }
    .logo span { color: #a78bfa; font-weight: 400; }
    .modes {
      display: flex; gap: 6px;
    }
    .mode-btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      color: #94a3b8;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .mode-btn:hover, .mode-btn.active {
      background: rgba(0,212,255,0.15);
      border-color: #00d4ff;
      color: #00d4ff;
    }

    /* Classical Score player */
    .score-player {
      position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
      z-index: 20;
      display: flex; align-items: center; gap: 14px;
      background: rgba(8,13,21,0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 999px;
      padding: 10px 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .score-player button {
      background: none; border: none; color: #e2e8f0; cursor: pointer;
      width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s;
    }
    .score-player button:hover { background: rgba(255,255,255,0.1); }
    .score-player .play-btn {
      background: #00d4ff; color: #080d15; width: 42px; height: 42px;
    }
    .score-player .play-btn:hover { background: #22e0ff; }
    .track-info {
      min-width: 160px; text-align: center;
    }
    .track-title { font-size: 0.85rem; font-weight: 600; }
    .track-sub { font-size: 0.7rem; color: #64748b; margin-top: 2px; }
    .vol-slider {
      width: 70px; accent-color: #00d4ff;
    }

    /* Side panels */
    .panel {
      position: absolute; z-index: 15;
      background: rgba(8,13,21,0.82);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 14px;
      max-width: 260px;
    }
    .panel h3 {
      font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.12em;
      color: #64748b; margin-bottom: 10px;
    }
    .left-panel { top: 70px; left: 16px; }
    .right-panel { top: 70px; right: 16px; }

    .node-item {
      padding: 8px 10px; border-radius: 8px; cursor: pointer;
      font-size: 0.85rem; margin-bottom: 4px;
      border: 1px solid transparent;
    }
    .node-item:hover, .node-item.selected {
      background: rgba(0,212,255,0.1);
      border-color: rgba(0,212,255,0.3);
    }
    .status-dot {
      display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      margin-right: 8px;
    }
    .healthy { background: #00e5b0; }
    .stressed { background: #ffb800; }
    .critical { background: #ff4757; }

    .stat-row {
      display: flex; justify-content: space-between;
      font-size: 0.8rem; margin-bottom: 6px;
    }
    .stat-row span:last-child { font-family: monospace; color: #00d4ff; }

    .footer-note {
      position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%);
      font-size: 0.7rem; color: #475569; z-index: 10;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <div class="topbar">
    <div class="logo">TAFA <span>Explorer</span></div>
    <div class="modes">
      <button class="mode-btn active" data-mode="sky">Sky</button>
      <button class="mode-btn" data-mode="cosmos">Cosmos</button>
      <button class="mode-btn" data-mode="lens">Lens</button>
      <button class="mode-btn" data-mode="lab">Lab</button>
    </div>
  </div>

  <div class="panel left-panel">
    <h3>Nodes</h3>
    <div id="node-list"></div>
  </div>

  <div class="panel right-panel">
    <h3>Live Metrics</h3>
    <div class="stat-row"><span>Mode</span><span id="m-mode">Sky</span></div>
    <div class="stat-row"><span>Nodes</span><span id="m-nodes">6</span></div>
    <div class="stat-row"><span>Coherence</span><span id="m-coh">—</span></div>
    <div class="stat-row"><span>Curvature</span><span id="m-curv">—</span></div>
    <div class="stat-row"><span>Heatmap</span><span id="m-heat">OFF</span></div>
    <div style="margin-top:12px">
      <button id="toggle-heat" style="width:100%;padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.05);color:#e2e8f0;cursor:pointer">Toggle Heatmap</button>
    </div>
  </div>

  <!-- Classical Score Player -->
  <div class="score-player">
    <button id="prev-track" title="Previous">⏮</button>
    <button class="play-btn" id="play-pause" title="Play / Pause">▶</button>
    <button id="next-track" title="Next">⏭</button>
    <div class="track-info">
      <div class="track-title" id="track-title">Classical Score</div>
      <div class="track-sub" id="track-sub">Ready · Ambient cosmic</div>
    </div>
    <input type="range" class="vol-slider" id="volume" min="0" max="1" step="0.05" value="0.55" />
  </div>

  <div class="footer-note">
    TAFA / Golden Dragon lens · Dual TOE physics · Classical Score added for public release
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.1/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.1/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ---------- Classical Score (Web Audio generative ambient) ----------
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    let masterGain = null;
    let isPlaying = false;
    let currentTrack = 0;
    let oscillators = [];

    const tracks = [
      { title: "Cone Resonance", sub: "TAFA ambient · 35° geometry" },
      { title: "Axion Drift", sub: "18.7 eV mediator meditation" },
      { title: "Golden Dragon Flow", sub: "Structured path · classical" },
      { title: "Dual TOE Dialogue", sub: "Consciousness ↔ Quantum" }
    ];

    function initAudio() {
      if (audioCtx) return;
      audioCtx = new AudioCtx();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.55;
      masterGain.connect(audioCtx.destination);
    }

    function stopAllOsc() {
      oscillators.forEach(o => { try { o.stop(); } catch(e){} });
      oscillators = [];
    }

    function startGenerative(trackIdx) {
      initAudio();
      stopAllOsc();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const base = [110, 146.83, 164.81, 196][trackIdx % 4]; // A2, D3, E3, G3-ish
      const intervals = [0, 7, 12, 16, 19]; // fifth + harmonics

      intervals.forEach((semi, i) => {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = i % 2 === 0 ? 'sine' : 'triangle';
        osc.frequency.value = base * Math.pow(2, semi / 12);
        g.gain.value = 0.04 / (i + 1);

        // slow LFO on amplitude for breathing feel
        const lfo = audioCtx.createOscillator();
        const lfoGain = audioCtx.createGain();
        lfo.frequency.value = 0.05 + i * 0.01;
        lfoGain.gain.value = 0.015;
        lfo.connect(lfoGain);
        lfoGain.connect(g.gain);
        lfo.start();

        osc.connect(g);
        g.connect(masterGain);
        osc.start();
        oscillators.push(osc);
        oscillators.push(lfo);
      });
    }

    function updateTrackUI() {
      document.getElementById('track-title').textContent = tracks[currentTrack].title;
      document.getElementById('track-sub').textContent = tracks[currentTrack].sub;
      document.getElementById('play-pause').textContent = isPlaying ? '❚❚' : '▶';
    }

    document.getElementById('play-pause').addEventListener('click', () => {
      initAudio();
      if (isPlaying) {
        stopAllOsc();
        isPlaying = false;
      } else {
        startGenerative(currentTrack);
        isPlaying = true;
      }
      updateTrackUI();
    });

    document.getElementById('next-track').addEventListener('click', () => {
      currentTrack = (currentTrack + 1) % tracks.length;
      if (isPlaying) startGenerative(currentTrack);
      updateTrackUI();
    });

    document.getElementById('prev-track').addEventListener('click', () => {
      currentTrack = (currentTrack - 1 + tracks.length) % tracks.length;
      if (isPlaying) startGenerative(currentTrack);
      updateTrackUI();
    });

    document.getElementById('volume').addEventListener('input', (e) => {
      if (masterGain) masterGain.gain.value = parseFloat(e.target.value);
    });

    updateTrackUI();

    // ---------- Three.js scene (inspired by private universe-explorer) ----------
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x080d15);
    scene.fog = new THREE.Fog(0x080d15, 18, 55);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(0, 6, 14);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.35;
    controls.minDistance = 5;
    controls.maxDistance = 40;

    // lights
    scene.add(new THREE.AmbientLight(0x404060, 0.4));
    const p1 = new THREE.PointLight(0x00d4ff, 1.2, 50);
    p1.position.set(10, 12, 8);
    scene.add(p1);
    const p2 = new THREE.PointLight(0xa855f7, 0.6, 40);
    p2.position.set(-12, -6, -8);
    scene.add(p2);

    // stars
    const starGeo = new THREE.BufferGeometry();
    const starCount = 4000;
    const positions = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount * 3; i++) {
      positions[i] = (Math.random() - 0.5) * 120;
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({
      color: 0xffffff, size: 0.08, transparent: true, opacity: 0.8
    }));
    scene.add(stars);

    // grid
    const grid = new THREE.GridHelper(40, 40, 0x1a3a4a, 0x0d1f2d);
    grid.position.y = -6;
    scene.add(grid);

    // sample nodes (from private prototype spirit)
    const nodesData = [
      { name: 'Coastal Hub', pos: [3, 1, -2], stress: 25 },
      { name: 'Mountain Node', pos: [-4, 2, 1], stress: 45 },
      { name: 'Desert Outpost', pos: [0, -1, 4], stress: 72 },
      { name: 'Urban Core', pos: [-2, 0, -3], stress: 15 },
      { name: 'Island Station', pos: [5, -2, 2], stress: 58 },
      { name: 'Arctic Base', pos: [-1, 3, 0], stress: 35 }
    ];

    function statusColor(s) {
      if (s < 35) return 0x00e5b0;
      if (s < 65) return 0xffb800;
      return 0xff4757;
    }

    const nodeMeshes = [];
    const nodeGroup = new THREE.Group();
    scene.add(nodeGroup);

    nodesData.forEach((n, idx) => {
      const color = statusColor(n.stress);
      const size = 0.35 + (Math.random() * 0.15);

      const geo = new THREE.IcosahedronGeometry(size, 1);
      const mat = new THREE.MeshStandardMaterial({
        color, emissive: color, emissiveIntensity: 0.45,
        metalness: 0.7, roughness: 0.25
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(...n.pos);
      mesh.userData = { ...n, idx };
      nodeGroup.add(mesh);

      // glow
      const glow = new THREE.Mesh(
        new THREE.SphereGeometry(size * 1.6, 16, 16),
        new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.12 })
      );
      glow.position.copy(mesh.position);
      nodeGroup.add(glow);

      // ring
      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(size * 1.9, 0.025, 8, 48),
        new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.55 })
      );
      ring.position.copy(mesh.position);
      ring.rotation.x = Math.PI / 3;
      nodeGroup.add(ring);

      nodeMeshes.push({ mesh, glow, ring, data: n });
    });

    // connections
    const lineMat = new THREE.LineBasicMaterial({ color: 0x00d4ff, transparent: true, opacity: 0.18 });
    for (let i = 0; i < nodesData.length; i++) {
      for (let j = i + 1; j < nodesData.length; j++) {
        const a = new THREE.Vector3(...nodesData[i].pos);
        const b = new THREE.Vector3(...nodesData[j].pos);
        if (a.distanceTo(b) < 8) {
          const geo = new THREE.BufferGeometry().setFromPoints([a, b]);
          scene.add(new THREE.Line(geo, lineMat));
        }
      }
    }

    // UI node list
    const listEl = document.getElementById('node-list');
    nodesData.forEach((n, i) => {
      const div = document.createElement('div');
      div.className = 'node-item';
      const cls = n.stress < 35 ? 'healthy' : n.stress < 65 ? 'stressed' : 'critical';
      div.innerHTML = `<span class="status-dot ${cls}"></span>${n.name}`;
      div.addEventListener('click', () => selectNode(i));
      listEl.appendChild(div);
    });

    let selected = -1;
    let showHeat = false;

    function selectNode(i) {
      selected = i;
      document.querySelectorAll('.node-item').forEach((el, idx) => {
        el.classList.toggle('selected', idx === i);
      });
    }

    document.getElementById('toggle-heat').addEventListener('click', () => {
      showHeat = !showHeat;
      document.getElementById('m-heat').textContent = showHeat ? 'ON' : 'OFF';
    });

    // mode buttons
    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('m-mode').textContent = btn.dataset.mode.charAt(0).toUpperCase() + btn.dataset.mode.slice(1);
      });
    });

    // simple Dual-TOE style metrics animation
    let t = 0;
    function updateMetrics(dt) {
      t += dt;
      const coh = (0.55 + 0.25 * Math.sin(t * 0.4) + 0.1 * Math.sin(t * 1.1)).toFixed(3);
      const curv = (1.1 + 0.3 * Math.cos(t * 0.25)).toFixed(3);
      document.getElementById('m-coh').textContent = coh;
      document.getElementById('m-curv').textContent = curv;
    }

    // animation loop
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();
      controls.update();

      nodeMeshes.forEach(({ mesh, glow, ring, data }, i) => {
        mesh.rotation.y += 0.006;
        ring.rotation.z += 0.008;
        const pulse = 1 + 0.08 * Math.sin(clock.elapsedTime * 2 + i);
        glow.scale.setScalar(pulse);

        if (showHeat) {
          const intensity = 0.3 + data.stress / 100;
          mesh.material.emissiveIntensity = intensity;
        } else {
          mesh.material.emissiveIntensity = selected === i ? 1.2 : 0.45;
        }
      });

      stars.rotation.y += 0.00015;
      updateMetrics(dt);
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
